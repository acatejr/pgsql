services:
  postgres:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres_db
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    # networks:
    #   - mystack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgsql-data:

