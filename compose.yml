services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres_db
    env_file: .env
    ports:
      - 5432:5432
    volumes:
        - pgsql-data:/var/lib/postgresql/data
    restart: unless-stopped
    tty: true
    stdin_open: true

volumes:
  pgsql-data:

