
services:
  postgres:
    build: .
    container_name: sandbox-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./extensions.sql:/docker-entrypoint-initdb.d/extensions.sql
    networks:
      - postgres-network

volumes:
  postgres-data:

networks:
  postgres-network:
    driver: bridge
